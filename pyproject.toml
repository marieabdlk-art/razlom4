[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "razlom4-protocol"
version = "0.2.2"
description = "A falsifiable four-agent conflict protocol with deterministic gates and maximin selection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mariam"}]
keywords = ["llm", "multi-agent", "debate", "reasoning", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]
dependencies = []

[project.urls]
Repository = "https://github.com/marieabdlk-art/razlom4"
Issues = "https://github.com/marieabdlk-art/razlom4/issues"

[project.scripts]
razlom4 = "razlom4:main"
razlom4-benchmark = "razlom4_benchmark:main"
razlom4-full = "razlom4_full:main"

[tool.setuptools]
py-modules = ["razlom4", "razlom4_benchmark", "razlom4_full"]
